<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="780" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Login and Refresh Token Rotation</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">AccountController + AccountService + TokenService</text>

  <!-- lifelines -->
  <text x="130" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Client</text>
  <line x1="130" y1="100" x2="130" y2="740" stroke="#cbd5e1" stroke-width="2"/>

  <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">AccountController</text>
  <line x1="450" y1="100" x2="450" y2="740" stroke="#cbd5e1" stroke-width="2"/>

  <text x="770" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">AccountService / TokenService</text>
  <line x1="770" y1="100" x2="770" y2="740" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Step 1: login -->
  <line x1="130" y1="140" x2="440" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="285" y="132" text-anchor="middle" font-size="12.5" fill="#1e293b">POST /account/login (email, password)</text>

  <line x1="450" y1="170" x2="760" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="605" y="162" text-anchor="middle" font-size="12.5" fill="#1e293b">LoginUserAsync(dto)</text>

  <rect x="600" y="190" width="260" height="66" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="730" y="210" text-anchor="middle" font-size="11.5" fill="#334155">Verify credentials · reuse active</text>
  <text x="730" y="226" text-anchor="middle" font-size="11.5" fill="#334155">refresh token or generate a new one</text>
  <text x="730" y="242" text-anchor="middle" font-size="11.5" fill="#334155">Issue signed JWT access token</text>

  <line x1="760" y1="270" x2="460" y2="270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="605" y="262" text-anchor="middle" font-size="12.5" fill="#64748b">LoginDetailsDto (user, accessToken, refreshToken)</text>

  <line x1="450" y1="300" x2="140" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="285" y="292" text-anchor="middle" font-size="12.5" fill="#64748b">200 OK + accessToken body</text>
  <text x="285" y="314" text-anchor="middle" font-size="11" fill="#94a3b8">refreshToken set as HttpOnly cookie</text>

  <!-- divider -->
  <line x1="60" y1="345" x2="840" y2="345" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Later: access token expires</text>

  <!-- Step 2: refresh -->
  <line x1="130" y1="400" x2="440" y2="400" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="285" y="392" text-anchor="middle" font-size="12.5" fill="#1e293b">GET /account/refresh-token (cookie)</text>

  <line x1="450" y1="430" x2="760" y2="430" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="605" y="422" text-anchor="middle" font-size="12.5" fill="#1e293b">RefreshTokenAsync(refreshToken)</text>

  <rect x="600" y="450" width="260" height="82" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="730" y="470" text-anchor="middle" font-size="11.5" fill="#334155">Find user owning the token</text>
  <text x="730" y="486" text-anchor="middle" font-size="11.5" fill="#334155">Reject if expired/revoked/unknown</text>
  <text x="730" y="502" text-anchor="middle" font-size="11.5" fill="#334155">Revoke old token, generate new</text>
  <text x="730" y="518" text-anchor="middle" font-size="11.5" fill="#334155">refresh + access token pair</text>

  <line x1="760" y1="546" x2="460" y2="546" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="605" y="538" text-anchor="middle" font-size="12.5" fill="#64748b">new LoginDetailsDto</text>

  <line x1="450" y1="576" x2="140" y2="576" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <text x="285" y="568" text-anchor="middle" font-size="12.5" fill="#64748b">200 OK + new accessToken</text>
  <text x="285" y="590" text-anchor="middle" font-size="11" fill="#94a3b8">new refreshToken cookie replaces the old one</text>

  <!-- divider -->
  <line x1="60" y1="615" x2="840" y2="615" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="638" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Explicit sign-out: revoke</text>

  <!-- Step 3: revoke -->
  <line x1="130" y1="668" x2="440" y2="668" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="285" y="660" text-anchor="middle" font-size="12.5" fill="#1e293b">POST /account/revoke-token</text>

  <line x1="450" y1="698" x2="760" y2="698" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="605" y="690" text-anchor="middle" font-size="12.5" fill="#1e293b">RevokeRefreshTokenAsync(token)</text>

  <text x="605" y="722" text-anchor="middle" font-size="11.5" fill="#64748b">Token marked RevokedOn = now — can no longer be used to refresh</text>
</svg>
