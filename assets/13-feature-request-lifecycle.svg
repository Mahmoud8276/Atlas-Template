<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="720" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Request Lifecycle for a New Feature</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">Example: creating a resource end to end, layer by layer</text>

  <text x="140" y="96" font-size="12.5" font-weight="700" fill="#2563eb">1. Request in</text>

  <rect x="140" y="106" width="620" height="60" rx="8" fill="#1e293b"/>
  <text x="450" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Client → Controller (Api layer)</text>
  <text x="450" y="148" text-anchor="middle" font-size="11.5" fill="#cbd5e1">e.g. POST /api/v1/products — receives a Create-style DTO from the request body</text>

  <line x1="450" y1="166" x2="450" y2="198" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <rect x="140" y="200" width="620" height="70" rx="8" fill="#2563eb"/>
  <text x="450" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Service (Services layer)</text>
  <text x="450" y="242" text-anchor="middle" font-size="11.5" fill="#dbeafe">WriteService.CreateAsync: runs FluentValidation, maps DTO → entity with Mapster,</text>
  <text x="450" y="258" text-anchor="middle" font-size="11.5" fill="#dbeafe">calls BeforeCreateAsync hook for custom rules</text>

  <line x1="450" y1="270" x2="450" y2="302" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <rect x="140" y="304" width="620" height="70" rx="8" fill="#475569"/>
  <text x="450" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Repository + UnitOfWork (Infrastructure layer)</text>
  <text x="450" y="346" text-anchor="middle" font-size="11.5" fill="#e2e8f0">GenericRepository.AddAsync() stages the entity;</text>
  <text x="450" y="362" text-anchor="middle" font-size="11.5" fill="#e2e8f0">UnitOfWork.CompleteAsync() commits via AppDbContext.SaveChangesAsync()</text>

  <line x1="450" y1="374" x2="450" y2="406" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <rect x="140" y="408" width="620" height="56" rx="8" fill="#0f172a"/>
  <text x="450" y="432" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Database</text>
  <text x="450" y="450" text-anchor="middle" font-size="11.5" fill="#94a3b8">SQL Server, via EF Core migrations generated from the Core model</text>

  <!-- return loop, right side -->
  <text x="810" y="98" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="middle">2. Result out</text>
  <line x1="765" y1="436" x2="810" y2="436" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="810" y1="436" x2="810" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="810" y1="235" x2="765" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowBack)"/>
  <text x="826" y="335" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(90 826 335)">saved entity returns up the call stack</text>

  <line x1="140" y1="235" x2="95" y2="235" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="95" y1="235" x2="95" y2="600" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="95" y1="600" x2="290" y2="600" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow4)"/>
  <text x="70" y="420" font-size="11" fill="#2563eb" text-anchor="middle" transform="rotate(-90 70 420)">entity mapped to DetailsDto, wrapped in Response&lt;T&gt;</text>

  <rect x="290" y="568" width="320" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="450" y="592" text-anchor="middle" font-size="12.5" fill="#334155">Response&lt;T&gt; returned to the Controller</text>
  <text x="450" y="610" text-anchor="middle" font-size="11" fill="#64748b">Controller: StatusCode((int)result.StatusCode, result)</text>

  <line x1="450" y1="632" x2="450" y2="664" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <rect x="290" y="666" width="320" height="54" rx="8" fill="#2563eb"/>
  <text x="450" y="688" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">201 Created — JSON body</text>
  <text x="450" y="704" text-anchor="middle" font-size="11" fill="#dbeafe">{ isSuccess, data: DetailsDto, statusCode, message }</text>
</svg>
